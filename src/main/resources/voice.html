<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VCH / Voice</title>
<style>@font-face{font-family:IBM Plex Mono;src:url("/fonts/IBMPlexMono-Regular.ttf") format("truetype")}*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#161616;font:16px "IBM Plex Mono",monospace}header{background:#161616;color:white;padding:24px 6vw}main{max-width:800px;margin:60px auto;padding:24px}h1{font-size:44px;font-weight:400}button,select{padding:16px;border:0;font:inherit}button{background:#0f62fe;color:white;cursor:pointer}button:disabled{opacity:.45}#talk{width:100%;padding:40px;font-size:22px;touch-action:none;user-select:none}#talk.active{background:#198038}section{background:white;padding:24px;margin:20px 0}label{display:block;margin:16px 0 8px}select{width:100%;background:#f4f4f4}#status{line-height:1.6}small{color:#525252}#leave{background:#393939}</style>
<header>VCH / Encrypted voice</header><main><small id="channel">PRIVATE VOICE CHANNEL</small><h1>Press. Speak. Connect.</h1><p>One speaker at a time. Audio travels through encrypted WebRTC data channels.</p>
<section><label for="mic">Microphone</label><select id="mic"></select><label for="speaker">Playback device</label><select id="speaker"></select><p><button id="start">Enable audio</button> <button id="leave">Leave</button></p><div id="status" role="status">Enable audio to load the local DAC model and connect.</div><p id="peers"></p></section>
<button id="talk" disabled>Hold to talk</button><p><small id="hint">Keep this panel focused while using the keyboard shortcut.</small></p></main>
<script>
'use strict';
const token=decodeURIComponent(location.hash.slice(1));history.replaceState(null,'',location.pathname);
const $=id=>document.getElementById(id),connections=new Map(),earlyIce=new Map();
let settings,context,stream,processor,source,inputGain,monitor,running=false,pressed=false,transmitting=false,claiming=false,encoding=false,heartbeatBusy=false,floor='',chunks=[],samples=0,nextPlay=0,pollTimer,claimTimer;
const status=text=>{$('status').textContent=text};
async function api(path,data={}){if(window.VchNative){const j=JSON.parse(window.VchNative.request(path,JSON.stringify(data)));if(j.error)throw Error(j.error);return j}const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-VCH-Token':token},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'Voice request failed');return j}
const to64=buffer=>{let s='';for(const b of new Uint8Array(buffer))s+=String.fromCharCode(b);return btoa(s)};
const from64=s=>{const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer};
async function devices(){const list=await navigator.mediaDevices.enumerateDevices();for(const [id,kind,preferred]of[['mic','audioinput',settings.input],['speaker','audiooutput',settings.output]]){const menu=$(id);menu.replaceChildren();for(const d of list.filter(d=>d.kind===kind)){const option=new Option(d.label||'Default',d.deviceId);menu.add(option);if(d.label.includes(preferred)&&preferred!=='Default')menu.value=d.deviceId}}}
async function sendSignal(to,data){await api('/signal',{action:'signal',to,data})}
function peer(id,offer){if(connections.has(id))return connections.get(id);const ice=settings.ice.split(',').map(s=>s.trim()).filter(Boolean).map(urls=>({urls}));const pc=new RTCPeerConnection({iceServers:ice});const entry={pc,dc:null};connections.set(id,entry);
pc.onicecandidate=e=>{if(e.candidate)sendSignal(id,{candidate:e.candidate.toJSON()}).catch(e=>status(e.message))};
pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState)){pc.close();connections.delete(id)}};
const setup=dc=>{entry.dc=dc;dc.onmessage=async event=>{try{if(id!==floor)return;const envelope=JSON.parse(event.data);const out=await api('/decode',{author:id,envelope});const pcm=new Float32Array(from64(out.data));if(!context||!running||floor===settings.account)return;const buffer=context.createBuffer(1,pcm.length,out.sampleRate);buffer.copyToChannel(pcm,0);const playback=context.createBufferSource();playback.buffer=buffer;const volume=context.createGain();volume.gain.value=settings.outputGain/100;playback.connect(volume).connect(context.destination);nextPlay=Math.max(context.currentTime+.04,Math.min(nextPlay,context.currentTime+1));playback.start(nextPlay);nextPlay+=buffer.duration}catch(e){status(e.message)}}};
pc.ondatachannel=e=>setup(e.channel);if(offer){setup(pc.createDataChannel('vch-dac',{ordered:false,maxRetransmits:0}));pc.createOffer().then(sdp=>pc.setLocalDescription(sdp)).then(()=>sendSignal(id,{description:pc.localDescription.toJSON()})).catch(e=>status(e.message))}return entry}
async function applyState(state){floor=state.floor||'';$('peers').textContent=state.peers.length+' other participant(s) · '+(floor?(floor===settings.account?'your microphone is live':'another member is speaking'):'channel is quiet');
if(floor!==settings.account&&transmitting)stopLocal();for(const id of state.peers)if(settings.account<id)peer(id,true);
for(const [id,p]of connections)if(!state.peers.includes(id)){p.pc.close();connections.delete(id)}
for(const signal of state.signals){const id=signal.from,data=signal.data;if(!state.peers.includes(id))continue;const p=peer(id,false);try{if(data.description){await p.pc.setRemoteDescription(data.description);for(const c of earlyIce.get(id)||[])await p.pc.addIceCandidate(c);earlyIce.delete(id);if(data.description.type==='offer'){await p.pc.setLocalDescription(await p.pc.createAnswer());await sendSignal(id,{description:p.pc.localDescription.toJSON()})}}else if(data.candidate){if(p.pc.remoteDescription)await p.pc.addIceCandidate(data.candidate);else{const q=earlyIce.get(id)||[];if(q.length<64)q.push(data.candidate);earlyIce.set(id,q)}}}catch(e){status(e.message)}}}
async function heartbeat(){if(!running||heartbeatBusy)return;heartbeatBusy=true;try{await applyState(await api('/signal',{action:transmitting?'claim':'heartbeat'}))}catch(e){await leave();status(e.message)}finally{heartbeatBusy=false}}
function stopLocal(){transmitting=false;chunks=[];samples=0;$('talk').classList.remove('active');$('talk').textContent='Hold to talk';if(source)source.disconnect();}
async function begin(){if(!running||pressed)return;pressed=true;if(claiming)return;claiming=true;try{const result=await api('/signal',{action:'claim'});await applyState(result);if(!pressed||!running||result.floor!==settings.account){if(result.floor===settings.account)await api('/signal',{action:'release'});return}transmitting=true;source.connect(inputGain);$('talk').classList.add('active');$('talk').textContent='You are speaking · release to stop'}catch(e){status(e.message)}finally{claiming=false}}
async function end(){pressed=false;stopLocal();if(running)try{await applyState(await api('/signal',{action:'release'}))}catch(e){status(e.message)}}
function downsample(input,rate){if(rate===16000)return input.slice();const length=Math.floor(input.length*16000/rate),out=new Float32Array(length);for(let i=0;i<length;i++){const a=Math.floor(i*rate/16000),b=Math.max(a+1,Math.floor((i+1)*rate/16000));let sum=0;for(let j=a;j<Math.min(b,input.length);j++)sum+=input[j];out[i]=sum/(b-a)}return out}
async function encode(pcm){if(encoding||!transmitting)return;encoding=true;try{const envelope=await api('/encode',{data:to64(pcm.buffer)});if(!transmitting)return;const data=JSON.stringify(envelope);for(const {dc}of connections.values())if(dc&&dc.readyState==='open'&&dc.bufferedAmount<32000)dc.send(data)}catch(e){status(e.message);stopLocal()}finally{encoding=false}}
$('start').onclick=async()=>{try{$('start').disabled=true;status('Loading local DAC model… first use may take a few minutes.');await api('/codec',{op:'init'});stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:$('mic').value?{exact:$('mic').value}:undefined,channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:false},video:false});await devices();context=new AudioContext();await context.resume();if($('speaker').value&&context.setSinkId)await context.setSinkId($('speaker').value);source=context.createMediaStreamSource(stream);inputGain=context.createGain();inputGain.gain.value=settings.inputGain/100;
// Capture remains disconnected from processing until a server floor lease is granted.
processor=context.createScriptProcessor(4096,1,1);monitor=context.createGain();monitor.gain.value=0;inputGain.connect(processor);processor.connect(monitor).connect(context.destination);processor.onaudioprocess=event=>{if(!transmitting)return;const data=downsample(event.inputBuffer.getChannelData(0),context.sampleRate);chunks.push(data);samples+=data.length;if(samples>=8000){const frame=new Float32Array(samples);let n=0;for(const chunk of chunks){frame.set(chunk,n);n+=chunk.length}chunks=[];samples=0;encode(frame)}};running=true;$('talk').disabled=false;pollTimer=setInterval(heartbeat,800);await heartbeat();status('Connected · DAC loaded · hold '+settings.ptt+' to speak.')}catch(e){status(e.message);$('start').disabled=false;if(stream)stream.getTracks().forEach(t=>t.stop());if(context)context.close()}};
async function leave(){pressed=false;stopLocal();clearInterval(pollTimer);if(running)try{await api('/signal',{action:'leave'})}catch(e){}running=false;for(const p of connections.values())p.pc.close();connections.clear();if(stream)stream.getTracks().forEach(t=>t.stop());if(context)context.close();$('talk').disabled=true;$('start').disabled=false;status('Disconnected · microphone stopped')}
$('leave').onclick=leave;$('talk').onpointerdown=e=>{e.preventDefault();$('talk').setPointerCapture(e.pointerId);begin()};$('talk').onpointerup=end;$('talk').onpointercancel=end;
const match=e=>e.code===(settings?.ptt==='SPACE'?'Space':settings?.ptt==='V'?'KeyV':'F8');document.onkeydown=e=>{if(match(e)&&!e.repeat&&!['SELECT','INPUT'].includes(e.target.tagName)){e.preventDefault();begin()}};document.onkeyup=e=>{if(match(e)){e.preventDefault();end()}};window.onblur=end;document.onvisibilitychange=()=>{if(document.hidden)end()};window.onpagehide=leave;
api('/settings').then(async s=>{settings=s;$('channel').textContent=s.channel.toUpperCase();$('hint').textContent='Hold '+s.ptt+' while this panel is focused. Release or switch windows to mute.';await devices()}).catch(e=>status(e.message));
</script></html>
