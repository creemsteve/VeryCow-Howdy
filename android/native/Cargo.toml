[package]
name = "vch-android"
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "vch_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
vch = { path = "../..", default-features = false, features = ["neural"] }
jni = "0.21.1"
serde_json = "1"
zeroize = "1"
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
